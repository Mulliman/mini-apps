  }

  // Puts the ground's top edge on the queue's shoulder line, so the passengers
  // stand waist-deep in the paved band with their heads against the hedge.
  // Measured off a real passenger rather than recomputed from the CSS ratios,
  // which would mean maintaining those ratios in two places. The front
  // passenger is deliberately skipped: it is drawn larger, so its shoulders sit
  // higher than the line the rest of the queue defines.
  var lastGroundY = 0;
  function paintPavementHorizon() {
    if (!pavementEl) return;
    var sample = queueEl.querySelector('.queue-person:not(.front) .qp-body') ||
                 queueEl.querySelector('.qp-body');
    if (sample) {
      var h = pavementEl.getBoundingClientRect().bottom -
              sample.getBoundingClientRect().top;
      if (h > 0) lastGroundY = Math.round(h);
    }
    // With nobody left to measure, hold the horizon where it was rather than
    // letting it jump on the last boarding of the level.
    if (lastGroundY > 0) {
      pavementEl.style.setProperty('--ground-y', lastGroundY + 'px');
    }
  }

  // ---------------- overlay ----------------
  function spawnConfetti() {
    confettiLayerEl.innerHTML = '';
    if (reducedMotion) return;
    for (var i = 0; i < 26; i++) {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      var color = COLORS[i % COLORS.length];
      piece.style.background = color;
      piece.style.left = (Math.random() * 100) + '%';
      piece.style.animationDuration = (900 + Math.random() * 700) + 'ms';
      piece.style.animationDelay = (Math.random() * 400) + 'ms';
      confettiLayerEl.appendChild(piece);
    }
  }
  function showOverlay(status) {
    overlayMode = status;
    if (status === 'START') {
      overlayTitleEl.textContent = 'Level ' + levelFor(gameState.difficulty);
      overlayMsgEl.textContent = titleCase(gameState.difficulty) + ' · ' +
        gameState.N + '×' + gameState.N + ' · ' + gameState.queue.length + ' passengers';
      overlayRestartBtn.textContent = 'Start';
      confettiLayerEl.innerHTML = '';
    } else if (status === 'WON') {
      overlayTitleEl.textContent = 'You did it!';
      overlayMsgEl.textContent = 'Every bus and every passenger made it. Great job!';
      overlayRestartBtn.textContent = 'Next Level';
      spawnConfetti();
    } else {
      overlayTitleEl.textContent = "Let's try again!";
      overlayMsgEl.textContent = 'The buses got a little stuck this time. Ready to try this level again?';
      overlayRestartBtn.textContent = 'Try Again';
      confettiLayerEl.innerHTML = '';
    }
    overlayEl.classList.add('visible');
  }
  function hideOverlay() {
    overlayMode = null;
    overlayEl.classList.remove('visible');
    confettiLayerEl.innerHTML = '';
  }

  // ---------------- animation helpers ----------------
  function shakeElement(el) {
    if (!el) return;
    el.classList.remove('block-shake', 'wiggle');
    void el.offsetWidth; // force reflow so the animation can restart
    el.classList.add('block-shake');
    el.addEventListener('animationend', function handler() {
      el.classList.remove('block-shake');
      el.removeEventListener('animationend', handler);
    });
  }
  function animateDriveOff(innerEl) {
    if (!innerEl) return;
    var dist = (gameState.N + 2.5) * cellPx;
    innerEl.classList.add('drive-off');
    void innerEl.offsetWidth; // force a reflow so the transition engages
    innerEl.style.transform = 'translateX(' + dist + 'px)';
    innerEl.style.opacity = '0';
  }

  // ---------------- drive-to-bay flight ----------------
  // A tapped bus doesn't just fade off the edge of the grid: it drives out
  // along its own heading onto the perimeter road, follows the lane round to
  // the side the bays are on, and turns into its bay. The grid clips its own
  // overflow and the bays sit in a different container, so the bus that moves
  // is a CLONE in the fixed .drive-layer over the whole page; the real board
  // element is removed the instant the clone takes over.
  //
  // Everything is measured off live getBoundingClientRect() geometry rather
  // than recomputed from --cell, so the path stays correct whatever the ring's
  // padding, the board's size or the bays' wrapping happen to be.
  var FLIGHT_PX_PER_MS = 1.5;
  var FLIGHT_MIN_MS = 320, FLIGHT_MAX_MS = 820;
  var FLIGHT_TURN = 0.05; // share of the flight spent pivoting at a corner

  function clampTo(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // Picks the representation of `deg` within +/-180 of `prev`, so a bus
  // turning from 170deg to -170deg swings 20deg the short way rather than
  // spinning 340deg the wrong way.
  function unwrapDeg(deg, prev) {
    var a = deg;
    while (a - prev > 180) a -= 360;
    while (a - prev < -180) a += 360;
    return a;
  }

  // The waypoints of one flight, in viewport pixels: grid position, the point
  // where it meets the road, any corners it rounds, then the bay.
  function flightWaypoints(start, headingRad, bayRect) {
    var ring = roadRingEl.getBoundingClientRect();
    var board = boardEl.getBoundingClientRect();
    // Lane centres: halfway between the ring's outer edge and the grid's edge.
    var laneTop = (ring.top + board.top) / 2;
    var laneBottom = (ring.bottom + board.bottom) / 2;
    var laneLeft = (ring.left + board.left) / 2;
    var laneRight = (ring.right + board.right) / 2;

    // How far along its own heading the bus travels before its centre lands on
    // a lane. Whichever lane it reaches first is the side it exits by — which
    // falls out of the same formula for diagonals as for N/S/E/W.
    var ux = Math.cos(headingRad), uy = Math.sin(headingRad);
    var tx = ux > 1e-3 ? (laneRight - start.x) / ux
           : ux < -1e-3 ? (laneLeft - start.x) / ux : Infinity;
    var ty = uy > 1e-3 ? (laneBottom - start.y) / uy
           : uy < -1e-3 ? (laneTop - start.y) / uy : Infinity;
    var t = Math.max(0, Math.min(tx, ty));
    if (!isFinite(t)) return null;
    var exitSide = (ty <= tx) ? (uy > 0 ? 'bottom' : 'top') : (ux > 0 ? 'right' : 'left');
    var exit = {
      x: clampTo(start.x + ux * t, laneLeft, laneRight),
      y: clampTo(start.y + uy * t, laneTop, laneBottom)
    };

    // The bays are above the board today, but route to whichever lane is
    // nearer the bay so a future layout change doesn't send buses the wrong way.
    var bayCx = bayRect.left + bayRect.width / 2;
    var bayCy = bayRect.top + bayRect.height / 2;
    var entryTop = bayCy < (ring.top + ring.bottom) / 2;
    var entrySide = entryTop ? 'top' : 'bottom';
    var entryY = entryTop ? laneTop : laneBottom;

    var pts = [start, exit];
    if (exitSide === 'left' || exitSide === 'right') {
      pts.push({ x: exitSide === 'right' ? laneRight : laneLeft, y: entryY });
    } else if (exitSide !== entrySide) {
      // Came out of the far lane: round whichever end of the lot is nearer.
      var viaRight = Math.abs(exit.x - laneRight) <= Math.abs(exit.x - laneLeft);
      var cornerX = viaRight ? laneRight : laneLeft;
      pts.push({ x: cornerX, y: exit.y });
      pts.push({ x: cornerX, y: entryY });
    }
    pts.push({ x: clampTo(bayCx, laneLeft, laneRight), y: entryY });
    pts.push({ x: bayCx, y: bayCy });

    // Drop waypoints the bus is effectively already standing on, so a bus that
    // exits straight onto a corner doesn't get a zero-length segment (whose
    // atan2 heading would be meaningless) inserted into the path.
    var out = [pts[0]];
    for (var i = 1; i < pts.length; i++) {
      var prev = out[out.length - 1];
      if (Math.hypot(pts[i].x - prev.x, pts[i].y - prev.y) > 1) out.push(pts[i]);
    }
    return out.length >= 2 ? out : null;
  }

  function animateDriveToBay(outerEl, vehicle, slotIndex) {
    var slotEl = bayEls[slotIndex];
    if (!outerEl || !slotEl || !driveLayerEl || typeof outerEl.animate !== 'function') return null;

    var startRect = outerEl.getBoundingClientRect();
    var bayRect = slotEl.getBoundingClientRect();
    if (!startRect.width || !bayRect.width) return null;

    var body = vehicleBodyRect(vehicle);
    var headingRad = body.ang;
    // The outer element is rotated about its own centre, so the centre of its
    // axis-aligned bounding box is still the centre of the bus.
    var start = { x: startRect.left + startRect.width / 2, y: startRect.top + startRect.height / 2 };
    var pts = flightWaypoints(start, headingRad, bayRect);
    if (!pts) return null;

    var busLen = body.len * cellPx;   // nose-to-tail
    var busWid = body.wid * cellPx;   // across
    var ring = roadRingEl.getBoundingClientRect();
    var board = boardEl.getBoundingClientRect();
    var laneW = Math.max(1, board.top - ring.top);
    // Ease the bus down to roughly lane width on the road (a sliver of overhang
    // still reads fine) and down again to fit the bay it parks in.
    var roadScale = clampTo((laneW * 1.15) / busWid, 0.55, 1);
    var bayScale = clampTo(Math.min(
      (bayRect.width * 0.78) / busWid,
      (bayRect.height * 0.92) / busLen
    ), 0.3, 1);

    var clone = outerEl.cloneNode(true);
    clone.className = 'vehicle drive-clone';
    clone.style.left = '0px';
    clone.style.top = '0px';
    // The clone must keep the bus's UNROTATED box (buildVehicleEl's inline
    // width/height), not startRect, which is the rotated bounding box.
    clone.style.width = outerEl.style.width || (busLen + 'px');
    clone.style.height = outerEl.style.height || (busWid + 'px');
    var innerClone = innerOf(clone);
    if (innerClone) innerClone.classList.remove('drive-off', 'block-shake', 'wiggle');

    function tf(pt, deg, scale) {
      return 'translate(-50%, -50%) translate(' + pt.x + 'px, ' + pt.y + 'px) ' +
             'rotate(' + deg + 'deg) scale(' + scale + ')';
    }

    // Segment lengths and headings, with headings unwrapped so consecutive
    // turns always take the short way round.
    var segs = [], total = 0, prevDeg = headingRad * 180 / Math.PI;
    for (var i = 1; i < pts.length; i++) {
      var dx = pts[i].x - pts[i - 1].x, dy = pts[i].y - pts[i - 1].y;
      var d = Math.hypot(dx, dy);
      prevDeg = unwrapDeg(Math.atan2(dy, dx) * 180 / Math.PI, prevDeg);
      segs.push({ d: d, deg: prevDeg });
      total += d;
    }
    if (total < 1) return null;

    // Two keyframes per interior waypoint — arrive on the old heading, pivot to
    // the new one over a short beat — so the bus tracks each straight rather
    // than rotating gradually across the whole leg.
    var kfs = [{ offset: 0, transform: tf(pts[0], segs[0].deg, 1), easing: 'ease-in' }];
    var cum = 0;
    for (var k = 1; k < pts.length - 1; k++) {
      cum += segs[k - 1].d;
      var o = clampTo(cum / total, 0, 1);
      var turn = Math.min(FLIGHT_TURN, (segs[k].d / total) * 0.5);
      kfs.push({ offset: o, transform: tf(pts[k], segs[k - 1].deg, roadScale), easing: 'linear' });
      kfs.push({ offset: clampTo(o + turn, o, 1), transform: tf(pts[k], segs[k].deg, roadScale), easing: 'linear' });
    }
    kfs.push({
      offset: 1,
      transform: tf(pts[pts.length - 1], segs[segs.length - 1].deg, bayScale),
      easing: 'ease-out'
    });

    // Park the clone on frame 0 of the flight before it goes into the document:
    // the cloned inline transform positions it relative to the BOARD, which
    // would put it in the page's top-left corner inside the drive layer.
    clone.style.transform = kfs[0].transform;
    driveLayerEl.appendChild(clone);
    var duration = clampTo(total / FLIGHT_PX_PER_MS, FLIGHT_MIN_MS, FLIGHT_MAX_MS);
    var anim = clone.animate(kfs, { duration: duration, fill: 'forwards' });

    // Resolves the moment the bus lands. The caller pops the real bay vehicle
    // in straight away and the clone cross-fades out underneath it.
    return anim.finished.then(function () {
      var fade = clone.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, easing: 'ease-out', fill: 'forwards' });
      fade.finished.then(function () { clone.remove(); }, function () { clone.remove(); });
    }, function () {
      clone.remove();
    });
  }

  // ---------------- core tap sequence ----------------
  async function runTapSequence(vehicleId) {
    var vehicle = gameState.vehicles[vehicleId];
    if (!vehicle) return;
    var el = vehicleEls.get(vehicleId);

    // Snapshot pre-tap visuals so the cascade can be replayed step-by-step
    // even though tapVehicle mutates gameState synchronously and completely.
    var shadowBays = gameState.bays.map(function (id) {
      if (id === null) return null;
      var v = gameState.vehicles[id];
      return { id: id, color: v.color, boarded: v.boarded, cap: v.cap };
    });
    var shadowQueue = gameState.queue.slice();

    var result = tapVehicle(gameState, vehicleId);

    if (!result.ok) {
      if (result.reason === 'BLOCKED') {
        sound.playWiggle();
        shakeElement(innerOf(el));
        await wait(500);
      } else if (result.reason === 'NO_BAY') {
        sound.playAlert();
        shakeElement(innerOf(el));
        await wait(500);
      }
      return;
    }

    // Recorded the instant the tap is confirmed successful — gameState itself
    // was already mutated synchronously inside tapVehicle above, regardless of
    // whether the animation below runs to completion, so the move log has to
    // track that, not the animation.
    sessionMoves.push(vehicleId);

    var arriveEv = null;
    for (var i = 0; i < result.events.length; i++) {
      if (result.events[i].type === 'ARRIVE') { arriveEv = result.events[i]; break; }
    }

    if (el) {
      // Hand the bus over to a clone in the drive layer while the board copy is
      // still in place — animateDriveToBay measures it to start the flight.
      var flight = (arriveEv && !reducedMotion)
        ? animateDriveToBay(el, vehicle, arriveEv.slot)
        : null;
      if (flight) {
        el.remove(); // the clone has taken over; only one bus on screen
        vehicleEls.delete(vehicleId);
        await flight;
      } else {
        // Nothing to drive to, reduced motion, or the flight couldn't be
        // measured: fall back to the plain drive-off at the grid's edge.
        animateDriveOff(innerOf(el));
        await wait(TIMING.drive);
        el.remove();
        vehicleEls.delete(vehicleId);
      }
    }

    if (arriveEv) {
      shadowBays[arriveEv.slot] = { id: vehicleId, color: vehicle.color, boarded: 0, cap: vehicle.cap };
      paintBaySlots(shadowBays, arriveEv.slot);
      await wait(TIMING.postArrive);
    }

    for (var e = 0; e < result.events.length; e++) {
      var ev = result.events[e];
      if (ev.type === 'ARRIVE' || ev.type === 'STATUS') continue;

      if (ev.type === 'BOARD') {
        var front = queueEl.querySelector('.queue-person');
        if (front) front.classList.add('boarding');
        sound.playPop();
        await wait(TIMING.boardStep);
        shadowQueue = shadowQueue.slice(1);
        renderQueue(shadowQueue);
        if (shadowBays[ev.slot]) shadowBays[ev.slot].boarded = ev.boarded;
        paintBaySlots(shadowBays, ev.slot);
      } else if (ev.type === 'DEPART') {
        var slotEl = bayEls[ev.slot];
        sound.playDepart();
        if (slotEl) slotEl.classList.add('depart');
        await wait(TIMING.departStep);
        shadowBays[ev.slot] = null;
        paintBaySlots(shadowBays, -1);
      }
    }

    // Authoritative re-sync — guarantees the DOM matches gameState exactly,
    // regardless of any drift in the cosmetic replay above.
    renderQueue();
    renderBays();
    renderStats();
    saveSession();

    var statusEvent = null;
    for (var s = 0; s < result.events.length; s++) {
      if (result.events[s].type === 'STATUS') { statusEvent = result.events[s]; break; }
    }
    if (statusEvent) {
      await wait(TIMING.statusDelay);
      if (statusEvent.status === 'WON') {
        stats.won++;
        // Clearing a level advances that tier's level counter.
        if (!stats.wonByTier) stats.wonByTier = emptyWonByTier();
        stats.wonByTier[gameState.difficulty] = (stats.wonByTier[gameState.difficulty] || 0) + 1;
        renderToolbar();
        sound.playVictory();
        showOverlay('WON');
      } else {
        sound.playDefeat();
        showOverlay('LOST');
      }
      saveStats();
    }
  }

  async function onVehicleTap(vehicleId) {
    if (inputLocked || awaitingStart) return;
    if (!gameState || gameState.status !== 'PLAYING') return;
    if (!gameState.vehicles[vehicleId]) return;
    inputLocked = true;
    try {
      await runTapSequence(vehicleId);
    } catch (err) {
      // A defensive net: presentation bugs must never soft-brick the game.
      try { renderQueue(); renderBays(); renderBoard(); } catch (e2) { /* ignore */ }
    } finally {
      inputLocked = false;
    }
  }

  // ---------------- game lifecycle ----------------
  function fullRender() {
    renderToolbar();
    renderStats();
    renderBays();
    renderQueue();
    computeAndApplyCellSize();
    renderBoard();
    if (gameState.status !== 'PLAYING') {
      showOverlay(gameState.status);
    } else if (awaitingStart) {
      showOverlay('START');
    } else {
      hideOverlay();
    }
  }

  function newGame(difficulty, optionalSeed) {
    var seed = (optionalSeed !== undefined) ? optionalSeed : randomSeed();
    gameState = generateLevel(difficulty, seed);
    sessionMoves = []; // a fresh board has no move log yet
    stats.played++;
    saveStats();
    awaitingStart = (optionalSeed === undefined);
    saveSession();
    fullRender();
  }

  function init() {
    document.body.classList.toggle('reduced-motion', reducedMotion);
    document.documentElement.style.setProperty('--dur-drive', TIMING.drive + 'ms');
    document.documentElement.style.setProperty('--dur-wiggle', TIMING.wiggle + 'ms');
    document.documentElement.style.setProperty('--dur-bay-pop', TIMING.postArrive + 'ms');
    document.documentElement.style.setProperty('--dur-bay-depart', TIMING.departStep + 'ms');
    document.documentElement.style.setProperty('--dur-board', TIMING.boardStep + 'ms');

    var restored = loadSession();
    if (restored) {
      gameState = restored.state;
      sessionMoves = restored.moves;
    } else {
      gameState = generateLevel('easy', randomSeed());
      sessionMoves = [];
      stats.played++;
      saveStats();
      // First ever load gets the start card too; a RESTORED game does not,
      // since the player is resuming a level already under way.
      awaitingStart = true;
      saveSession();
    }

    fullRender();

    boardEl.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('.vehicle') : null;
      if (el) onVehicleTap(el.dataset.id);
    });

    diffBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var d = btn.dataset.diff;
        if (inputLocked) return;
        if (d !== gameState.difficulty || awaitingStart) newGame(d);
      });
    });

    restartBtn.addEventListener('click', function () {
      if (inputLocked) return;
      newGame(gameState.difficulty);
    });

    if (overlayCloseBtn) {
      overlayCloseBtn.addEventListener('click', function () {
        if (inputLocked) return;
        awaitingStart = false;
        hideOverlay();
      });
    }

    overlayRestartBtn.addEventListener('click', function () {
      if (inputLocked) return;
      // On the start card this button just begins the level already generated
      // behind it — generating a fresh one here would throw that board away
      // and show a different level from the one the card announced.
      if (overlayMode === 'START') {
        awaitingStart = false;
        hideOverlay();
        return;
      }
      if (overlayMode === 'LOST') {
        newGame(gameState.difficulty, gameState.seed);
        return;
      }
      newGame(gameState.difficulty);
    });

    soundBtn.addEventListener('click', function () {
      sound.muted = !sound.muted;
      renderToolbar();
    });

    document.addEventListener('pointerdown', function firstGesture() {
      sound.resume();
      document.removeEventListener('pointerdown', firstGesture);
    });

    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        computeAndApplyCellSize();
        renderBoard();
        // The passenger COUNT no longer depends on width, but how tightly they
        // pack to fit does, so the row still has to be re-laid out here.
        renderQueue();
      }, 80);
    });

    // Save state on tab switch, screen lock, or backgrounding (essential on mobile/Kindle Fire)
    var handleLifecycleSave = function () {
      if (gameState && gameState.status === 'PLAYING') {
        saveSession();
      }
      saveStats();
    };
    window.addEventListener('pagehide', handleLifecycleSave);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') {
        handleLifecycleSave();
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
